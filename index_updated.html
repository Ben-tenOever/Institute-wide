<!doctype html>
<html lang="en">
<head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1" /> <title>NYULH Research Constellations</title> <style> :root { --bg:#f5f5f7; --text:#222; --muted:#666; --card:#fff; --border:#e6e6ea; --nyu:#410093; --nyu2:#5f2ca1; } * { box-sizing:border-box; } body { margin:0; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); } header { background:linear-gradient(90deg,var(--nyu),var(--nyu2)); color:#fff; padding:22px 24px; } header h1 { margin:0 0 6px 0; font-size:22px; font-weight:700; } header p { margin:0; opacity:.92; } .tabs { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; } .tab { display:inline-block; color:#fff; text-decoration:none; opacity:.96; padding:8px 12px; border:1px solid rgba(255,255,255,.30); border-radius:999px; } .tab:hover { opacity:1; border-color:rgba(255,255,255,.55); } .subnav { margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; } .subnav a { color:#fff; opacity:.9; text-decoration:none; } .subnav a:hover { opacity:1; text-decoration:underline; } .hero { display:grid; grid-template-columns: 1.2fr 1fr; gap:14px; align-items:start; } @media (max-width: 920px){ .hero{ grid-template-columns:1fr; } } .hero-title{ font-size:14px; font-weight:700; letter-spacing:.02em; margin-bottom:6px; } main { max-width:1180px; margin:0 auto; padding:18px 16px 44px 16px; } .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:0 6px 18px rgba(0,0,0,.06); } .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; } input[type="search"] { width:min(520px,100%); padding:10px 12px; border-radius:12px; border:1px solid var(--border); outline:none; } select { padding:10px 12px; border-radius:12px; border:1px solid var(--border); } .small { color:var(--muted); font-size:13px; line-height:1.35; } .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:14px; } details.fcard { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 6px 18px rgba(0,0,0,.06); overflow:hidden; } details.fcard > summary { list-style:none; cursor:pointer; padding:14px; } details.fcard > summary::-webkit-details-marker { display:none; } .summary-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; } .name { font-size:18px; font-weight:700; margin:0; } .subtitle { margin-top:4px; } .badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; } .badge { font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:#fafafa; } .snippet { margin-top:10px; line-height:1.55; } .expanded { border-top:1px solid var(--border); padding:14px; } .section { margin-top:12px; } .section:first-child { margin-top:0; } .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; } .content { margin-top:6px; line-height:1.55; } ul { margin:8px 0 0 18px; padding:0; } li { margin:6px 0; } .actions { margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; } .action { display:inline-block; padding:8px 10px; border-radius:12px; border:1px solid var(--border); background:#fff; color:var(--nyu); text-decoration:none; } .action:hover { border-color:rgba(65,0,147,.35); } footer { color:var(--muted); font-size:12px; padding:18px 0 0 0; } </style>
</head>
<body> <header> <h1>NYULH Research Constellations</h1> <p>Faculty synopses, paired collaborations, and team collaborations</p> <div class="tabs"> <a class="tab" href="teams_two.html">Paired Collaborations</a> <a class="tab" href="teams_programs.html">Team Collaborations</a> </div> <div class="subnav"> <a href="faculty.html">Faculty page</a> </div> </header> <main> <div class="hero"><div class="panel"><div class="hero-title">Overview</div><div class="small" id="overviewText">Loading overview…</div><div class="small" id="overviewStats" style="margin-top:10px"></div></div><div class="panel"> <div class="controls"> <input id="q" type="search" placeholder="Search name, synopsis, keywords, platforms" /> <select id="dept"></select> <select id="group"></select> </div> <div class="small" id="count" style="margin-top:10px"></div>  <div class="actions" style="margin-top:12px"> <a class="action" href="teams_two.html">Paired Collaborations</a> <a class="action" href="teams_programs.html">Team Collaborations</a> <a class="action" href="faculty.html">Faculty Directory</a> </div></div></div>  <div style="height:14px"></div> <div class="grid" id="grid"></div> <footer>Click a box to expand full profile details</footer> </main> <script src="faculty_data.js"></script> <script> function data() { return window.__FACULTY_DATA__; } function norm(s) { return (s |||| "").toLowerCase(); } function uniq(arr) { return Array.from(new Set(arr)); } function safeJoin(arr) { if (!arr |||| !arr.length) return ""; return arr.join(" "); } function ul(items) { if (!items |||| !items.length) return '<div class="small">None listed</div>'; return '<ul>' + items.map(x => `<li>${x}</li>`).join('') + '</ul>'; } function facultyText(f) { return [ f.name, f.title, safeJoin(f.affiliations), f.specialty_areas |||| "", f.lab_synopsis |||| "", f.common_experiments_raw |||| "", safeJoin(f.research_keywords), safeJoin(f.experimental_capabilities), safeJoin(f.model_systems), safeJoin(f.complementary_areas), safeJoin(f.example_grant_directions) ].join(" "); } function badges(f) { const a = (f.affiliations |||| []).map(x => `<span class="badge">${x}</span>`).join(""); const g = (f.focus_groups |||| []).map(x => `<span class="badge">${x}</span>`).join(""); return a + g; } function card(f) { const syn = (f.lab_synopsis |||| "").trim(); const snippet = syn.length ? (syn.slice(0, 240) + (syn.length > 240 ? "…" : "")) : ""; const common = (f.common_experiments_raw |||| "").trim(); return ` <details class="fcard"> <summary> <div class="summary-top"> <div> <div class="name">${f.name |||| ""}</div> <div class="small subtitle">${(f.title |||| f.specialty_areas |||| "").trim()}</div> <div class="badges">${badges(f)}</div> ${snippet ? `<div class="small snippet">${snippet}</div>` : ""} </div> </div> </summary> <div class="expanded"> <div class="section"> <div class="label">Lab synopsis</div> <div class="content">${(f.lab_synopsis |||| "").replaceAll("\n", "<br/>") |||| '<span class="small">None listed</span>'}</div> </div> <div class="section"> <div class="label">Common platforms and experiments</div> <div class="content">${common ? common.replaceAll("\n", "<br/>") : '<span class="small">None listed</span>'}</div> </div> <div class="section"> <div class="label">Research keywords</div> <div class="content">${ul(f.research_keywords)}</div> </div> <div class="section"> <div class="label">Experimental capabilities</div> <div class="content">${ul(f.experimental_capabilities)}</div> </div> <div class="section"> <div class="label">Model systems</div> <div class="content">${ul(f.model_systems)}</div> </div> <div class="section"> <div class="label">Complementary areas</div> <div class="content">${ul(f.complementary_areas)}</div> </div> <div class="section"> <div class="label">Example grant directions</div> <div class="content">${ul(f.example_grant_directions)}</div> </div> <div class="actions"> <a class="action" href="profile.html?id=${encodeURIComponent(f.faculty_id)}">Open standalone profile</a> </div> </div> </details> `; } const d = data(); const deptSel = document.getElementById("dept"); const groupSel = document.getElementById("group"); const depts = ["All"].concat(uniq(d.faculty.flatMap(f => f.affiliations |||| [])).sort()); deptSel.innerHTML = depts.map(x => `<option value="${x}">${x}</option>`).join(""); const groups = ["All"].concat(uniq(d.faculty.flatMap(f => f.focus_groups |||| [])).sort()); groupSel.innerHTML = groups.map(x => `<option value="${x}">${x}</option>`).join(""); const state = { q: "", dept: "All", group: "All" }; function render() { const q = norm(state.q); const hits = d.faculty.filter(f => { if (state.dept !== "All" && !(f.affiliations |||| []).includes(state.dept)) return false; if (state.group !== "All" && !(f.focus_groups |||| []).includes(state.group)) return false; if (!q) return true; return norm(facultyText(f)).includes(q); }); document.getElementById("count").textContent = `${hits.length} faculty shown`; document.getElementById("grid").innerHTML = hits.map(card).join(""); } document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderOverview();
render(); }); deptSel.addEventListener("change", e => { state.dept = e.target.value; render(); }); groupSel.addEventListener("change", e => { state.group = e.target.value; render(); }); render(); </script>

</body>
