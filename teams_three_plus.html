<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Institute wide Teams of three or more</title>
  <link rel="stylesheet" href="teams.css" />
</head>
<body>
<div class="container" style="max-width:1100px; margin:0 auto; padding:18px 16px;">
  <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:baseline;">
    <a href="index.html" style="text-decoration:none;">Home</a>
    <a href="faculty.html" style="text-decoration:none;">Faculty profiles</a>
    <a href="teams_two.html" style="text-decoration:none;">Pairs</a>
    <a href="teams_three_plus.html" style="text-decoration:none; font-weight:700;">Teams of three or more</a>
  </div>
</div>

<main id="app"><div class="container" style="max-width:1100px; margin:0 auto; padding:24px 16px;">Loading…</div></main>

<script>
(function () {
  var app = document.getElementById("app");

  function esc(s) {
    s = String(s == null ? "" : s);
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function loadJson(path, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", path + "?cb=" + Date.now(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status < 200 || xhr.status >= 300) return cb(new Error("Failed to load " + path + " status " + xhr.status));
      try { cb(null, JSON.parse(xhr.responseText)); }
      catch (e) { cb(new Error("JSON parse error for " + path + ": " + e)); }
    };
    xhr.onerror = function () { cb(new Error("Network error loading " + path)); };
    xhr.send(null);
  }

  function splitNames(v) {
    if (v == null) return [];
    if (Array.isArray(v)) return v.flatMap(splitNames);
    if (typeof v === "string") return v.split(/[\n,;|]+/g).map(function(x){return x.trim();}).filter(Boolean);
    return [];
  }

  function membersOf(t) {
    if (!t || typeof t !== "object") return [];
    if (Array.isArray(t.members)) return t.members;
    if (t.team_members) return splitNames(t.team_members);
    if (t.member_names) return splitNames(t.member_names);
    return [];
  }

  loadJson("data/faculty_index.json", function (e1, faculty) {
    if (e1) return app.innerHTML = '<pre style="white-space:pre-wrap; padding:16px;">' + esc(String(e1)) + '</pre>';

    // teams source differs by repo, try a few common names
    var candidates = ["data/teams.json", "teams_small.json", "teams_large.json", "data/teams_small.json", "data/teams_large.json"];
    (function tryNext(i){
      if (i >= candidates.length) {
        return app.innerHTML = '<pre style="white-space:pre-wrap; padding:16px;">Could not find any teams json file.</pre>';
      }
      loadJson(candidates[i], function(e2, rawTeams){
        if (e2) return tryNext(i+1);

        var teams = Array.isArray(rawTeams) ? rawTeams : (rawTeams && (rawTeams.teams || rawTeams.items || rawTeams.data)) || [];
        var idByName = {};
        (faculty || []).forEach(function(f){ idByName[String(f.name||"").toLowerCase()] = f.id; });

        function memberLink(name) {
          var fid = idByName[String(name||"").toLowerCase()] || "";
          return fid ? '<a href="profile.html?id=' + encodeURIComponent(fid) + '" style="text-decoration:none;">' + esc(name) + '</a>' : esc(name);
        }

        var big = teams.filter(function(t){ return membersOf(t).length >= 3; });

        var html = '<div class="container" style="max-width:1100px; margin:0 auto; padding:24px 16px;">';
        html += '<h1 style="margin:0;">Teams of three or more</h1>';
        html += '<div style="opacity:.75; margin-top:6px;">Found: ' + big.length + '</div>';
        html += '<div style="margin-top:16px; display:flex; flex-direction:column; gap:12px;">';

        big.forEach(function(t){
          var m = membersOf(t);
          var mhtml = m.map(memberLink).join(", ");
          html += '<div class="card" style="padding:16px;">';
          html += '<div style="font-weight:700; font-size:1.05rem;">' + esc(t.team_name || t.proposed_title || "") + '</div>';
          html += '<div style="opacity:.85; margin-top:6px;">' + mhtml + '</div>';
          if (t.opportunity_title) html += '<div style="margin-top:10px; opacity:.9;">Opportunity: ' + esc(t.opportunity_title) + '</div>';
          if (t.rationale) html += '<div style="margin-top:10px; opacity:.9;">' + esc(t.rationale) + '</div>';
          html += '</div>';
        });

        html += '</div></div>';
        app.innerHTML = html;
      });
    })(0);
  });
})();
</script>
</body>
</html>
